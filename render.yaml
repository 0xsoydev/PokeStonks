# Render blueprint for the authoritative battle server (long-lived websockets: NOT Vercel).
services:
  - type: web
    name: pokestonks-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: starter            # free instances sleep and drop live matches; use a paid instance for a demo
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: ARENA_ADDRESS
        sync: false
      - key: CLAIM_SIGNER_PRIVATE_KEY
        sync: false          # secret: set in the Render dashboard, never in git
      - key: RELAYER_PRIVATE_KEY
        sync: false          # secret; needs a little MON for gas
      - key: RPC_URL
        value: https://testnet-rpc.monad.xyz
