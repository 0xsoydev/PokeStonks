# Render blueprint for the authoritative battle server (long-lived websockets: NOT Vercel).
services:
  - type: web
    name: pokestonks-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    region: singapore
    plan: free                # free instances sleep after 15 idle minutes; .github/workflows/keepalive.yml pings it
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ARENA_ADDRESS
        value: "0x41930014D474415F0e9882DE82434f336502f5B0"
      - key: RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: CLAIM_SIGNER_PRIVATE_KEY
        sync: false           # secret: the arena's voucher signer. Set in the Render dashboard, never in git.
      - key: PYTH_API_KEY
        sync: false           # secret: free key from https://docs.pyth.network/price-feeds/pro/acquire-api-key
