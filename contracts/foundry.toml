[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Full metadata, literal sources, and no IPFS/bzzr hash: required for Sourcify verification on Monad.
cbor_metadata = true
extra_output = ["metadata"]
bytecode_hash = "none"
use_literal_content = true
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@pythnetwork/pyth-sdk-solidity/=node_modules/@pythnetwork/pyth-sdk-solidity/",
  "forge-std/=lib/forge-std/src/",
]
ignored_warnings_from = ["node_modules", "lib"]
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 512

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[lint]
# boolean-cst: false positive on `(0, true)` tuple returns; require-revert-in-loop: validation loops run only in constructors;
# block-timestamp: deadline/staleness checks are intentional (seconds granularity); reentrancy-events: claim is nonReentrant.
exclude_lints = ["boolean-cst", "require-revert-in-loop", "block-timestamp", "reentrancy-events"]
